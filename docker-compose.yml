# Local dev (infra only):   docker compose up -d postgres redis
# Full stack (turnkey):      docker compose --profile app up -d --build
#
# The api/web services are behind the `app` profile so a plain `docker compose up`
# still brings up only Postgres + Redis for host-run dev. Copy .env first:
#   cp .env.example .env   (then set API_KEY, AUTH_*, CORS_ORIGINS for production)
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ict-forward-lab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ict_forward_lab
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ict_forward_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ict-forward-lab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ict-forward-lab-api
    env_file:
      - .env
    environment:
      # Override host-oriented .env values with in-network service names.
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ict_forward_lab
      REDIS_URL: redis://redis:6379
      API_PORT: "3001"
    # Bound to loopback only — the internet reaches the API through Caddy (TLS).
    # Reachable in-network as http://api:3001 and on the host for local debugging.
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # All baked at build time (Next inlines NEXT_PUBLIC_* and freezes the
        # /api rewrite destination into the build manifest) — rebuild to change.
        # The browser opens the WS directly at the public domain via Caddy, so in
        # production set NEXT_PUBLIC_WS_URL=wss://<your-domain>/ws in .env. The
        # localhost default only works for a host-run dev API.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001/ws}
        NEXT_PUBLIC_REQUIRE_LOGIN: ${NEXT_PUBLIC_REQUIRE_LOGIN:-false}
        # Server-side /api proxy target inside the Docker network.
        API_PROXY_TARGET: http://api:3001
    container_name: ict-forward-lab-web
    environment:
      NODE_ENV: production
      # Runtime gate for the page middleware (server-side). Keep in sync with the
      # NEXT_PUBLIC_REQUIRE_LOGIN build arg, which controls the client UI.
      WEB_REQUIRE_LOGIN: ${WEB_REQUIRE_LOGIN:-false}
    # Loopback only — the internet reaches the web app through Caddy (TLS).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Reverse proxy / front door. Routes /ws → api, /api/* → api, else → web.
  #   SITE_ADDRESS=:80              plain HTTP, works on a bare IP (no cert)
  #   SITE_ADDRESS=lab.example.com  auto-HTTPS via Let's Encrypt (real DNS + 80/443)
  caddy:
    profiles: ["app"]
    image: caddy:2
    container_name: ict-forward-lab-caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
